name: CI

on:
  push:
    branches: ['**', '!ci-logs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # On feature branches the formatter fixes style itself and commits the
      # result, so review time goes to logic. main only ever checks.
      - name: Auto-format feature branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          dart format lib test
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: dart format"
            git push
          fi

      # Each step's output goes to ci-report.txt as well as the log. The
      # report is pushed to ci-logs/<branch> so it can be read with plain git.
      - name: Run checks
        id: checks
        shell: bash
        run: |
          set -o pipefail
          status=0
          run() {
            echo "===== $* =====" | tee -a ci-report.txt
            if ! "$@" 2>&1 | tee -a ci-report.txt; then status=1; fi
          }
          flutter --version | tee -a ci-report.txt
          run flutter pub get
          run dart format --output=none --set-exit-if-changed lib test
          run flutter analyze --no-fatal-infos
          run flutter test --reporter expanded
          echo "===== RESULT: $([ $status -eq 0 ] && echo PASS || echo FAIL) =====" | tee -a ci-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Publish report to ci-logs branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          branch="ci-logs/${GITHUB_REF_NAME}"
          mkdir -p /tmp/report && cp ci-report.txt /tmp/report/ 2>/dev/null || echo "no report" > /tmp/report/ci-report.txt
          echo "${GITHUB_SHA}" > /tmp/report/commit.txt
          cd /tmp/report
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "CI report for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

      - name: Fail if checks failed
        if: steps.checks.outputs.status != '0'
        run: exit 1

  deploy-web:
    name: Deploy web preview to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Bundle the rendering engine instead of loading it from Google's CDN,
      # which is unreliable from Iran.
      - run: flutter build web --release --base-href /karyad-app/ --no-web-resources-cdn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    name: Build Android APK
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: karyad-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
