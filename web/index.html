<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="کاریاد: یادآور سرویس خودرو و دفتر حساب رانندگان">
  <meta name="theme-color" content="#0E6E6D">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="کاریاد">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>کاریاد</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Branded loading screen shown until Flutter paints its first frame,
       so the first visit never shows a blank white page. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F6F9F9; }
    @media (prefers-color-scheme: dark) { html, body { background: #12201F; } }
    #karyad-splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: Vazirmatn, Tahoma, sans-serif; color: #4A5A59; }
    #karyad-splash img { width: 96px; height: 96px; animation: karyad-pulse 1.4s ease-in-out infinite; }
    @keyframes karyad-pulse { 50% { transform: scale(0.94); opacity: 0.85; } }
  </style>
  <div id="karyad-splash" aria-live="polite">
    <img src="icons/Icon-192.png" alt="کاریاد">
    <span>در حال بارگذاری کاریاد…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('karyad-splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
